
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASRA ELOBOOST | League of Legends</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#08090d;color:#f5f5f5;
 font-family:Arial,sans-serif;
}
header{
 padding:25px 8%;display:flex;
 justify-content:space-between;align-items:center;
 border-bottom:1px solid #25252b;
}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}
.logo span{color:#e63946}
nav a{color:#aaa;text-decoration:none;margin-left:22px}
.hero{
 min-height:430px;padding:100px 8%;
 background:radial-gradient(ellipse at 80% 40%,#54121c 0%,#151016 35%,#08090d 75%);
}
.hero h1{font-size:clamp(38px,7vw,65px);margin-bottom:18px}
.hero h1 span{color:#e63946}
.hero p{color:#aaa;font-size:17px;line-height:1.7}
.btn{
 display:inline-block;margin-top:28px;padding:15px 30px;
 background:#c92838;color:white;border:0;
 border-radius:5px;font-weight:bold;cursor:pointer;
}
section{padding:65px 8%}
h2{font-size:30px;margin-bottom:12px}
.sub{color:#999;margin-bottom:30px}
.panel{
 max-width:650px;background:#121319;
 border:1px solid #292a32;border-radius:12px;
 padding:28px;
}
label{display:block;margin:18px 0 9px;color:#ddd}
select{
 width:100%;padding:15px;background:#090a0e;
 color:white;border:1px solid #393a44;
 border-radius:5px;font-size:15px;
}
.result{
 margin-top:22px;padding:18px;
 background:#20151a;border-radius:6px;
 color:#eee;line-height:1.8;
}
footer{
 padding:30px;text-align:center;color:#777;
 border-top:1px solid #25252b;
}
</style>
</head>
<body>

<header>
 <div class="logo">ASRA <span>ELOBOOST</span></div>
 <nav><a href="#hizmetler">Hizmetler</a><a href="#siparis">Sipariş</a></nav>
</header>

<div class="hero">
 <h1>RANKINI <span>YÜKSELT.</span></h1>
 <p>Hedefine ulaş. Ligini yükselt.<br>
 ASRA ELOBOOST ile rekabette bir adım öne geç.</p>
 <a href="#siparis" class="btn">SİPARİŞ OLUŞTUR</a>
</div>

<section id="hizmetler">
 <h2>ASRA ELOBOOST</h2>
 <p class="sub">League of Legends rank hizmetleri</p>
 <div class="panel">
  <h3>Rankını belirle</h3>
  <p class="sub">Mevcut ve hedef ligini seç.</p>

  <label>Mevcut Ligin</label>
  <select id="current">
   <option>Demir</option>
   <option>Bronz</option>
   <option>Gümüş</option>
   <option>Altın</option>
   <option>Platin</option>
   <option>Zümrüt</option>
   <option>Elmas</option>
  </select>

  <label>Hedef Ligin</label>
  <select id="target">
   <option>Demir</option>
   <option>Bronz</option>
   <option>Gümüş</option>
   <option>Altın</option>
   <option>Platin</option>
   <option>Zümrüt</option>
   <option selected>Elmas</option>
  </select>

  <label>Oyun Modu</label>
  <select id="mode">
   <option>Solo Boost</option>
   <option>Duo Boost</option>
  </select>

  <button class="btn" onclick="createOrder()">TALEP OLUŞTUR</button>
  <div id="result" class="result" hidden></div>
 </div>
</section>

<footer>
 ASRA ELOBOOST © 2026 | Tüm hakları saklıdır.
</footer>

<script>
function createOrder(){
 const current=document.getElementById("current").value;
 const target=document.getElementById("target").value;
 const mode=document.getElementById("mode").value;
 const result=document.getElementById("result");
 result.hidden=false;
 result.innerHTML=
 "<strong>Sipariş talebin</strong><br>"+
 "Mevcut lig: "+current+"<br>"+
 "Hedef lig: "+target+"<br>"+
 "Hizmet: "+mode+"<br><br>"+
 "Talebin hazır. İletişim sistemi sonraki aşamada eklenecek.";
}
</script>

</body>
</html>
